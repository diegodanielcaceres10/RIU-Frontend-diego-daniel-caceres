name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build Angular
        run: npm run build

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest Results
          path: frontend/vitest/junit-report.xml
          reporter: java-junit

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/vitest/coverage

      - name: Normalize coverage report path
        if: always()
        run: |
          if [ -f vitest/coverage/cobertura-coverage.xml ]; then
            cp vitest/coverage/cobertura-coverage.xml vitest/coverage/coverage.xml
          elif [ -f vitest/coverage/cobertura.xml ]; then
            cp vitest/coverage/cobertura.xml vitest/coverage/coverage.xml
          else
            echo "Cobertura XML report not found."
            ls -la vitest/coverage || true
            exit 1
          fi

      - name: Debug header branch-rate from Cobertura XML
        if: always()
        run: |
          if [ -f vitest/coverage/cobertura-coverage.xml ]; then
            echo "Header package coverage line:"
            grep -n 'package name="app.components.header-component"' vitest/coverage/cobertura-coverage.xml || true
            echo "Header class coverage line:"
            grep -n 'class name="header-component.ts"' vitest/coverage/cobertura-coverage.xml || true
          else
            echo "cobertura-coverage.xml not found."
          fi

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: frontend/vitest/coverage/coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Add coverage to job summary
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ../code-coverage-results.md ]; then
            cat ../code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary file not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish coverage check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xmlCandidates = [
              'frontend/vitest/coverage/cobertura-coverage.xml',
              'frontend/vitest/coverage/coverage.xml'
            ];
            const summaryCandidates = ['code-coverage-results.md', 'frontend/code-coverage-results.md'];

            const percent = (rate) => `${Math.round(Number(rate || 0) * 100)}%`;
            let summary = `Coverage summary not found.\n\nCommit: ${context.sha}`;

            const xmlPath = xmlCandidates.find((path) => fs.existsSync(path));
            if (xmlPath) {
              const xml = fs.readFileSync(xmlPath, 'utf8');
              const root = xml.match(
                /<coverage[^>]*lines-covered="(\d+)"[^>]*lines-valid="(\d+)"[^>]*branches-covered="(\d+)"[^>]*branches-valid="(\d+)"[^>]*line-rate="([^"]+)"[^>]*branch-rate="([^"]+)"/
              );
              const packageMatches = [...xml.matchAll(/<package name="([^"]+)" line-rate="([^"]+)" branch-rate="([^"]+)"/g)];
              const packages = packageMatches
                .map((match) => ({
                  name: match[1],
                  lineRate: percent(match[2]),
                  branchRate: percent(match[3]),
                }))
                .sort((a, b) => a.name.localeCompare(b.name));

              const headerPkg = packages.find((pkg) => pkg.name === 'app.components.header-component');

              let table = '| Package | Line Rate | Branch Rate |\n| --- | --- | --- |\n';
              for (const pkg of packages) {
                table += `| ${pkg.name} | ${pkg.lineRate} | ${pkg.branchRate} |\n`;
              }

              const summaryLine = root
                ? `Summary: ${percent(root[5])} (${root[1]} / ${root[2]}) lines, ${percent(root[6])} (${root[3]} / ${root[4]}) branches`
                : 'Summary not available from Cobertura XML.';
              const headerLine = headerPkg
                ? `Header branch-rate: ${headerPkg.branchRate}`
                : 'Header branch-rate not found in Cobertura XML.';

              summary = [
                'Code Coverage (from Cobertura XML)',
                '',
                `Commit: ${context.sha}`,
                `Source: ${xmlPath}`,
                headerLine,
                '',
                table.trimEnd(),
                '',
                summaryLine
              ].join('\n');
            } else {
              for (const path of summaryCandidates) {
                if (fs.existsSync(path)) {
                  summary = `${fs.readFileSync(path, 'utf8')}\n\nCommit: ${context.sha}\nSource: ${path}`;
                  break;
                }
              }
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Coverage Results',
              head_sha: context.sha,
              status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: {
                title: 'Vitest Coverage',
                summary
              }
            });

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
