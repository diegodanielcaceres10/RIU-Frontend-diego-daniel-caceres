<div class="superhero-list">
  <div class="superhero-list__glow"></div>

  <div class="superhero-list__card">
    <div class="superhero-list__header">
      <h1 class="superhero-list__title">Listado de héroes</h1>
      <button mat-raised-button class="superhero-list__add-btn" (click)="goToAdd()">
        <mat-icon>add_circle</mat-icon>
        Añadir héroe
      </button>
    </div>

    <mat-form-field class="superhero-list__filter" appearance="outline">
      <mat-label>Buscar héroe</mat-label>
      <input
        matInput
        [value]="keyword()"
        (input)="onFilterChange($any($event.target).value)"
        placeholder="Ej: man"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="superhero-list__table-wrapper">
      @if (loading()) {
        <div class="superhero-list__loading">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      } @else {
        <table mat-table [dataSource]="pagedHeroes()" class="superhero-list__table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let superhero">{{ superhero.name }}</td>
          </ng-container>

          <ng-container matColumnDef="power">
            <th mat-header-cell *matHeaderCellDef>Poder</th>
            <td mat-cell *matCellDef="let superhero">{{ superhero.power }}</td>
          </ng-container>

          <ng-container matColumnDef="publisher">
            <th mat-header-cell *matHeaderCellDef>Editorial</th>
            <td mat-cell *matCellDef="let superhero">{{ superhero.publisher }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let superhero">
              <button mat-icon-button (click)="goToEdit(superhero.id)" aria-label="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                (click)="onDelete(superhero.id, superhero.name)"
                aria-label="Borrar"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        @if (pagedHeroes().length === 0) {
          <p class="superhero-list__empty">No se encontraron héroes.</p>
        }
      }
    </div>

    <mat-paginator
      [length]="totalHeroes()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</div>
